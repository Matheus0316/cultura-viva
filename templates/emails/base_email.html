<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Viva Tacima Notification</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #F4F1DE;
            /* Cultura Sand */
            margin: 0;
            padding: 0;
            color: #3D405B;
            /* Cultura Dark */
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .header {
            background-color: #3D405B;
            /* Cultura Dark */
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #E07A5F;
            /* Cultura Terracotta */
        }

        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header span {
            color: #E07A5F;
            /* Cultura Terracotta */
            font-style: italic;
            font-family: Georgia, serif;
        }

        .content {
            padding: 30px;
            line-height: 1.6;
            color: #3D405B;
        }

        .btn {
            display: inline-block;
            background-color: #E07A5F;
            /* Cultura Terracotta */
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 20px;
        }

        .footer {
            background-color: #F4F1DE;
            /* Cultura Sand */
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #81B29A;
            /* Cultura Green/Grayish */
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><span>Projeto</span> Cultura Viva</h1>
        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
        <div class="footer">
            <p>&copy; {% now "Y" %} Cultura Viva Tacima. Uma iniciativa comunitária.</p>
            <p>Casa da Cultura - Tacima/PB</p>
        </div>
    </div>
</body>

</html>
