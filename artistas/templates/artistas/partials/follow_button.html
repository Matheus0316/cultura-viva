<form>
    {% csrf_token %}
    {% if is_following %}
    <button type="submit" hx-post="{% url 'artistas:follow_artista' artista.id %}" hx-target="#follow-btn-container"
        hx-swap="innerHTML"
        class="px-6 py-2 bg-gray-200 text-gray-700 font-bold rounded-full hover:bg-gray-300 transition-all flex items-center gap-2 group">
        <i class="fa-solid fa-user-check text-brand-gold"></i>
        <span>Seguindo</span>
        <span
            class="text-xs bg-white px-2 py-0.5 rounded-full text-gray-500 group-hover:bg-brand-gold group-hover:text-white transition-colors">
            {{ followers_count }}
        </span>
    </button>
    {% else %}
    <button type="submit" hx-post="{% url 'artistas:follow_artista' artista.id %}" hx-target="#follow-btn-container"
        hx-swap="innerHTML"
        class="px-6 py-2 bg-brand-gold text-brand-brown font-bold rounded-full hover:bg-opacity-90 hover:scale-105 transform transition-all flex items-center gap-2">
        <i class="fa-solid fa-user-plus"></i>
        <span>Seguir Artista</span>
        {% if followers_count > 0 %}
        <span class="text-xs bg-brand-brown/10 px-2 py-0.5 rounded-full">
            {{ followers_count }}
        </span>
        {% endif %}
    </button>
    {% endif %}
</form>
