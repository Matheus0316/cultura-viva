<div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-2xl transition-all duration-500 border border-gray-100 flex flex-col h-full group">
    <!-- Thumbnail -->
    <div class="relative h-48 md:h-56 overflow-hidden">
        {% if post.thumbnail %}
            <img src="{{ post.thumbnail.url }}" alt="{{ post.title }}" class="w-full h-full object-cover transition duration-700 group-hover:scale-110">
        {% else %}
            <div class="w-full h-full bg-cultura-dark/10 flex items-center justify-center">
                <i class="fa-solid fa-newspaper fa-3x text-cultura-dark/20"></i>
            </div>
        {% endif %}
        
        <!-- Category Badge -->
        <div class="absolute top-4 left-4">
            <span class="bg-white/90 backdrop-blur-md text-cultura-dark text-[10px] font-black px-3 py-1 rounded-full shadow-sm uppercase tracking-widest border border-cultura-terracotta/20">
                {{ post.get_category_display }}
            </span>
        </div>
    </div>

    <!-- Content -->
    <div class="p-6 flex flex-col flex-grow bg-white relative">
        <!-- Date -->
        <div class="flex items-center text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-3">
            <i class="fa-regular fa-calendar-check mr-2 text-cultura-terracotta"></i>
            {{ post.created_at|date:"d M Y" }}
        </div>

        <!-- Title -->
        <h3 class="font-serif font-bold text-xl text-cultura-dark mb-4 leading-tight group-hover:text-cultura-terracotta transition-colors duration-300">
            <a href="{% url 'post:post_detail' post.id %}">
                {{ post.title }}
            </a>
        </h3>

        <!-- Excerpt -->
        <p class="text-gray-500 text-sm font-light leading-relaxed line-clamp-3 mb-6 flex-grow">
            {{ post.content|striptags|truncatechars:120 }}
        </p>

        <!-- Footer -->
        <div class="pt-4 border-t border-gray-50 flex items-center justify-between">
            <a href="{% url 'post:post_detail' post.id %}" class="inline-flex items-center text-cultura-terracotta font-display font-bold text-xs uppercase tracking-widest hover:text-cultura-dark transition-colors group/link">
                Ler mais 
                <span class="ml-2 transition-transform group-hover/link:translate-x-1">→</span>
            </a>
            
            {% if post.comments_enabled %}
            <div class="flex items-center text-gray-300 text-xs">
                <i class="fa-regular fa-comment mr-1"></i>
                <span class="font-bold">Interagir</span>
            </div>
            {% endif %}
        </div>
    </div>
</div>
