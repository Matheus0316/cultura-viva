{% extends 'base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
        <div class="text-center">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-6">
                <i class="fa-solid fa-triangle-exclamation text-red-600 text-2xl"></i>
            </div>
            <h2 class="mt-2 text-3xl font-display font-bold text-gray-900">
                Tem certeza?
            </h2>
            <p class="mt-4 text-sm text-gray-500">
                Você está prestes a excluir o item do acervo: <span class="font-bold text-gray-800">"{{ object.title
                    }}"</span>.
                <br>Esta ação não pode ser desfeita.
            </p>
        </div>
        <form class="mt-8 space-y-4" method="post">
            {% csrf_token %}
            <div class="flex flex-col sm:flex-row gap-4">
                <a href="{% url 'acervo:acervo_detail' object.pk %}"
                    class="w-full flex justify-center py-3 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cultura-terracotta transition">
                    Cancelar
                </a>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition">
                    Sim, excluir item
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
